name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: offline-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6, Node 24
        with:
          go-version: '1.27.x'
          cache: false # Standard library only: no go.sum or module cache required.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: '3.14.10'
      - run: go test ./...
        working-directory: go-core
      - run: python -m pip install -r requirements.txt
      - name: Build IPC core for tests
        shell: bash
        run: |
          cd go-core
          if [ "$RUNNER_OS" = "Windows" ]; then go build -o ../kotoba-core.exe .; else go build -o ../kotoba-core .; fi
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - run: go build .
        working-directory: go-core
